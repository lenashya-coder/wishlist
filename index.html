<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Вишлист Леночки 🤍</title>
<meta name="theme-color" content="#FBF5EF">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤍</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF5EF; --paper:#FFFDFB; --cream:#F5EBE2; --blush:#F3D9D3; --rose:#D6918A; --rose-d:#B26A62; --cocoa:#4A332D; --cocoa-2:#6B4D45; --muted:#9C8780; --line:#EEE3DA;
  --serif:'Cormorant Garamond', Georgia, serif; --sans:'Manrope', -apple-system, system-ui, sans-serif; --hand:'Caveat', cursive;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--sans); color:var(--cocoa); background:var(--bg); min-height:100vh;
  background-image: radial-gradient(60vw 50vw at 0% 0%, rgba(243,217,211,.75), transparent 70%), radial-gradient(55vw 45vw at 100% 12%, rgba(248,226,207,.8), transparent 70%);
  background-attachment:fixed; -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea{font:inherit;color:inherit}

header{max-width:1100px;margin:0 auto;padding:60px 22px 20px}
.hero{display:flex;flex-direction:column;gap:28px;align-items:center}
@media(min-width:800px){ .hero{flex-direction:row;justify-content:space-between;align-items:center;gap:48px;text-align:left} }
.hero-img{width:100%;max-width:380px;aspect-ratio:4/5;border-radius:24px;object-fit:cover;box-shadow:0 20px 40px -20px rgba(74,51,45,.4);border:6px solid var(--paper)}
.hero-text{flex:1;text-align:center}
@media(min-width:800px){ .hero-text{text-align:left} }
.kicker{font-family:var(--hand);font-size:26px;color:var(--rose-d);display:inline-block;transform:rotate(-3deg)}
h1{font-family:var(--serif);font-style:italic;font-weight:600;font-size:clamp(48px,10vw,84px);line-height:.95;margin:8px 0 18px;color:var(--cocoa)}
h1 .heart{display:inline-block;font-size:.62em;vertical-align:.12em}
.lead{max-width:440px;margin:0 auto;font-size:16px;line-height:1.6;color:var(--cocoa-2)}
@media(min-width:800px){ .lead{margin:0} }

.tabs{display:flex;justify-content:center;margin:26px auto 18px;padding:0 16px}
.tabs-in{display:inline-flex;background:rgba(255,253,251,.75);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px}
.tab{padding:9px 16px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);transition:.3s}
.tab.on{background:var(--cocoa);color:#fff}

main{max-width:1100px;margin:0 auto;padding:0 14px 120px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:720px){ .grid{grid-template-columns:repeat(3,1fr);gap:20px} main{padding:0 24px 140px} }
@media(min-width:1020px){ .grid{grid-template-columns:repeat(4,1fr)} }
.card{background:var(--paper);border-radius:26px;padding:7px;box-shadow:0 14px 34px -22px rgba(74,51,45,.45);cursor:pointer;display:flex;flex-direction:column;transition:transform .3s}
.card:hover{transform:translateY(-4px)}
.ph{position:relative;aspect-ratio:4/5;border-radius:20px;overflow:hidden;background:var(--cream)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph-empty{position:absolute;inset:0;display:grid;place-items:center;font-size:46px}
.cb{padding:11px 7px 5px;display:flex;flex-direction:column;flex:1}
.t{font-weight:600;font-size:14px;line-height:1.3}
.p{font-family:var(--serif);font-style:italic;font-weight:600;font-size:19px;color:var(--rose-d);margin-top:3px}
.btn{display:block;width:100%;margin-top:10px;border-radius:999px;padding:11px 10px;background:var(--cocoa);color:#fff;font-weight:600;font-size:13px;text-align:center}
.btn.off{background:var(--cream);color:var(--muted)}

.ov{position:fixed;inset:0;background:rgba(58,38,33,.32);backdrop-filter:blur(6px);z-index:50;opacity:0;pointer-events:none;transition:opacity .35s}
.ov.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--paper);border-radius:30px 30px 0 0;max-height:92vh;overflow:auto;padding:10px 20px calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .5s cubic-bezier(.2,.9,.2,1),visibility 0s .5s;visibility:hidden}
.sheet.on{transform:none;visibility:visible;transition:transform .5s}
@media(min-width:720px){ .sheet{left:50%;bottom:auto;top:50%;width:520px;border-radius:30px;transform:translate(-50%,-44%) scale(.96);opacity:0;transition:.4s} .sheet.on{transform:translate(-50%,-50%);opacity:1} }
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.x{position:sticky;top:0;float:right;width:34px;height:34px;border-radius:50%;background:var(--cream);font-size:18px;color:var(--cocoa-2);z-index:3}
.sh-t{font-family:var(--serif);font-weight:600;font-size:30px;line-height:1.05}
.sh-p{font-family:var(--serif);font-style:italic;font-weight:600;font-size:24px;color:var(--rose-d);margin-top:6px}
.f{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.f label{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted)}
.in{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 14px;font-size:15px;outline:none}
.in:focus{border-color:var(--rose);background:#fff}
textarea.in{min-height:76px}
.center{text-align:center}
.toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-100px);z-index:80;background:var(--cocoa);color:#fff;padding:12px 18px;border-radius:999px;transition:.4s}
.toast.on{transform:translate(-50%,0)}

/* Админ-панель */
.abar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:40;display:flex;gap:6px;background:rgba(74,51,45,.95);backdrop-filter:blur(12px);padding:6px;border-radius:999px;box-shadow:0 16px 40px -14px rgba(74,51,45,.7)}
.abar button{color:#fff;font-size:13px;font-weight:600;padding:11px 16px;border-radius:999px}
.abar .main{background:#fff;color:var(--cocoa)}
</style>
</head>
<body>

<header>
  <div class="hero">
    <img src="main-photo.jpeg" alt="Подарок" class="hero-img" onerror="this.style.display='none'">
    <div class="hero-text">
      <span class="kicker">мой маленький список счастья</span>
      <h1>Вишлист<br>Леночки <span class="heart">🤍</span></h1>
      <p class="lead">Здесь то, что меня порадует и согреет. Если хочешь сделать подарок — выбирай, бронируй, и никто не купит его второй раз. А кто именно дарит, я не узнаю до самого сюрприза ✨</p>
    </div>
  </div>
</header>

<div class="tabs"><div class="tabs-in" id="tabs">
  <button class="tab on" data-f="all">Все</button>
  <button class="tab" data-f="free">Свободные</button>
</div></div>

<main><div class="grid" id="grid"></div></main>

<div class="ov" id="ov"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<div id="abar"></div>

<script>
const API = ''; 
const $ = s => document.querySelector(s);
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d }catch(e){ return d } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch(e){} }
};
let wishes = [], filter = 'all';
let mine = LS.get('wl_mine', {});                 
const wantAdmin = /[?&]admin/.test(location.search);
let admin = wantAdmin; 
const DEMO = !API;

const demoSeed = [
  {id:'d1', title:'Свеча с ароматом инжира', price:'3200', top:true, note:'Любой тёплый аромат', links:[{url:'https://goldapple.ru',label:''}], image:'', reserved:false},
  {id:'d2', title:'Мягкий плед молочного цвета', price:'4500', top:false, note:'', links:[{url:'https://www.wildberries.ru',label:''}], image:'', reserved:true},
  {id:'d3', title:'Сертификат в книжный', price:'от 2000', top:false, note:'Чтобы выбрать что-то для души 📖', links:[], image:'', reserved:false}
];
function demoGet(){ return LS.get('wl_demo', demoSeed) }
function demoSet(v){ LS.set('wl_demo', v) }

async function api(action, data = {}){
  if (DEMO) return demoApi(action, data);
  const body = JSON.stringify(Object.assign({action}, data));
  const r = await fetch(API, {method:'POST', body});
  return r.json();
}
async function demoApi(a, d){
  await new Promise(r => setTimeout(r, 300));
  let list = demoGet();
  const w = list.find(x => x.id === d.id);
  if (a === 'list') return {ok:true, wishes:list};
  if (a === 'reserve'){ if (w.reserved) return {ok:false, error:'already'}; w.reserved = true; demoSet(list); return {ok:true, token:'demo-'+Date.now()} }
  if (a === 'unreserve'){ w.reserved = false; demoSet(list); return {ok:true} }
  if (a === 'save'){
    if (d.wish.id){ Object.assign(list.find(x => x.id === d.wish.id), d.wish) }
    else list.push(Object.assign({}, d.wish, {id:'d'+Date.now(), reserved:false}));
    demoSet(list); return {ok:true};
  }
  if (a === 'remove'){ demoSet(list.filter(x => x.id !== d.id)); return {ok:true} }
  return {ok:false};
}

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const price = p => { p = String(p ?? '').trim(); if (!p) return ''; if (/^\d[\d\s]*$/.test(p)) return Number(p.replace(/\s/g,'')).toLocaleString('ru-RU') + ' ₽'; return p; }
const emos = ['🎁','🤍','🕯️','🌷','✨','🧸','☁️','🍰'];
function img(w, i){ return w.image ? `<img src="${esc(w.image)}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'ph-empty',innerHTML:'🎁'}))">` : `<div class="ph-empty" style="background:var(--cream)">${emos[i%emos.length]}</div>` }

function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('on'), 2800) }

function render(){
  const g = $('#grid');
  const list = wishes.filter(w => filter === 'all' || (filter === 'free' && !w.reserved));
  g.innerHTML = list.map((w, i) => {
    const isMine = !!mine[w.id];
    let btn = `<button class="btn" data-a="res">Подарю это</button>`;
    if (isMine) btn = `<button class="btn off" disabled>Ты даришь это 🤍</button>`;
    else if (w.reserved) btn = `<button class="btn off" disabled>Уже занято</button>`;
    
    // В админке показываем кнопку редактирования
    let adminBtn = admin ? `<button class="btn" style="background:var(--blush);color:var(--rose-d);margin-top:5px" data-a="edit">✏️ Изменить</button>` : '';

    return `<article class="card" data-id="${esc(w.id)}">
      <div class="ph">${img(w, i)}</div>
      <div class="cb">
        <div class="t">${esc(w.title)}</div>
        ${w.price ? `<div class="p">${esc(price(w.price))}</div>` : ''}
        ${btn}
        ${adminBtn}
      </div></article>`;
  }).join('');
}

$('#grid').addEventListener('click', e => {
  const card = e.target.closest('.card'); if (!card) return;
  const id = card.dataset.id, a = e.target.closest('[data-a]')?.dataset.a;
  if (a === 'res') return askReserve(id);
  if (a === 'edit') return openEdit(id);
  openWish(id);
});

$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('.tab'); if (!b) return;
  filter = b.dataset.f;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t === b));
  render();
});

function openSheet(html){
  const s = $('#sheet');
  s.innerHTML = `<div class="grab"></div><button class="x" onclick="closeSheet()">×</button>` + html;
  requestAnimationFrame(() => { $('#ov').classList.add('on'); s.classList.add('on') });
  document.body.style.overflow = 'hidden';
}
function closeSheet(){ $('#ov').classList.remove('on'); $('#sheet').classList.remove('on'); document.body.style.overflow = '' }
$('#ov').onclick = closeSheet;

const byId = id => wishes.find(w => String(w.id) === String(id));

function openWish(id){
  const w = byId(id), i = wishes.indexOf(w), isMine = !!mine[id];
  openSheet(`
    <div style="aspect-ratio:1/1;border-radius:22px;overflow:hidden;background:var(--cream);margin:6px 0 16px;position:relative">${img(w, i)}</div>
    <div class="sh-t">${esc(w.title)}</div>
    ${w.price ? `<div class="sh-p">${esc(price(w.price))}</div>` : ''}
    ${w.note ? `<div style="margin-top:14px;font-size:15px;color:var(--cocoa-2)">${esc(w.note)}</div>` : ''}
    ${w.reserved && !isMine ? '<div style="margin-top:14px;font-weight:600;color:var(--rose-d)">Кто-то уже готовит этот подарок 🤍</div>' : ''}
    ${isMine ? '<div style="margin-top:14px;font-weight:600;color:var(--rose-d)">Ты даришь это 🤍</div>' : ''}
  `);
}

function askReserve(id){
  const w = byId(id);
  openSheet(`<div class="center" style="padding-top:20px">
    <div style="font-size:64px">🎁</div>
    <h3 class="sh-t">Подаришь «${esc(w.title)}»?</h3>
    <button class="btn" style="margin-top:20px" onclick="reserve('${esc(id)}')">Да, это подарю я</button>
    <button class="btn" style="background:var(--cream);color:var(--cocoa)" onclick="closeSheet()">Отмена</button>
  </div>`);
}
async function reserve(id){
  const r = await api('reserve', {id});
  if (r.ok){
    mine[id] = r.token; LS.set('wl_mine', mine);
    byId(id).reserved = true; render(); closeSheet(); toast('Ура, подарок твой! 🤍');
  } else { toast('Кто-то успел раньше 🙈'); closeSheet(); load(); }
}

let draft = null;
function openEdit(id){
  const w = id ? byId(id) : null;
  draft = w ? JSON.parse(JSON.stringify(w)) : {title:'', price:'', note:'', image:''};
  openSheet(`<h3>${w ? 'Изменить' : 'Новое желание ✨'}</h3>
    <div class="f"><label>Название</label><input class="in" id="e_t" value="${esc(draft.title)}"></div>
    <div class="f"><label>Цена</label><input class="in" id="e_p" value="${esc(draft.price)}"></div>
    <div class="f"><label>Комментарий</label><textarea class="in" id="e_n">${esc(draft.note)}</textarea></div>
    <div class="f"><label>Ссылка на фото (URL)</label><input class="in" id="e_i" value="${esc(draft.image)}"></div>
    <button class="btn" id="e_save" onclick="saveWish()" style="margin-top:20px">Сохранить</button>
    ${w ? `<button class="btn" style="background:#B4483C;margin-top:10px" onclick="removeWish('${esc(w.id)}')">Удалить</button>` : ''}`);
}
async function saveWish(){
  draft.title = $('#e_t').value.trim(); draft.price = $('#e_p').value.trim(); draft.note = $('#e_n').value.trim(); draft.image = $('#e_i').value.trim();
  if (!draft.title){ toast('Напиши название 🤍'); return }
  $('#e_save').innerHTML = '...';
  const r = await api('save', {wish: draft});
  if (r.ok){ closeSheet(); toast('Сохранено 🤍'); load() }
  else { toast('Ошибка'); $('#e_save').textContent = 'Сохранить'; }
}
async function removeWish(id){
  if (!confirm('Удалить?')) return;
  const r = await api('remove', {id});
  if (r.ok){ closeSheet(); toast('Удалено'); load() }
}

if (admin) {
  $('#abar').innerHTML = `<div class="abar"><button class="main" onclick="openEdit()">+ Желание</button><button onclick="location.href='?'">Выйти</button></div>`;
}

async function load(){
  const r = await api('list');
  wishes = (r.wishes || []).map(w => Object.assign(w, {id: String(w.id)}));
  render();
}
render(); load();
</script>
</body>
</html>
