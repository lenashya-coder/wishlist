<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Тест админки</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background: #FBF5EF; color: #4A332D; }
        .admin-box { display: none; background: #4A332D; color: white; padding: 20px; border-radius: 20px; margin-top: 20px; font-size: 20px;}
        .show { display: block !important; }
    </style>
</head>
<body>
    <h1>Мой сайт работает</h1>
    <p>Это обычная страница.</p>
    
    <div id="adminPanel" class="admin-box">
        🎉 УРА! АДМИНКА РАБОТАЕТ! 🎉
    </div>

    <script>
        // Проверяем, есть ли в ссылке ?admin
        if (window.location.search.includes('admin')) {
            document.getElementById('adminPanel').classList.add('show');
        }
    </script>
</body>
</html>
